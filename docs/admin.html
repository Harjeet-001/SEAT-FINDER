<!DOCTYPE html>
<html>
<head>
  <title>Admin – Upload Seating Data</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body>

<h2>Admin Panel – Upload Seating Excel</h2>

<h3>FN Session</h3>
<input type="file" id="FN_file" accept=".xlsx,.xls">
<button onclick="uploadExcel('FN')">Upload FN</button>

<h3>AN Session</h3>
<input type="file" id="AN_file" accept=".xlsx,.xls">
<button onclick="uploadExcel('AN')">Upload AN</button>

<script>
async function uploadExcel(session) {
  const file = document.getElementById(session + "_file").files[0];
  if (!file) {
    alert("Select an Excel file first");
    return;
  }

  const buffer = await file.arrayBuffer();
  const workbook = XLSX.read(buffer);
  const sheet = workbook.Sheets[workbook.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet);

  const res = await fetch(
    "https://seat-finder-api.harjeetgowda644.workers.dev/admin/upload",
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session, data: rows })
    }
  );

  const out = await res.json();
  alert(out.status === "ok" ? "Upload successful" : "Upload failed");
}
</script>

</body>
</html>
