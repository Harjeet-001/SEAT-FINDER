<!DOCTYPE html>
<html>
<head>
  <title>Admin – Upload Seating Data</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body>

<h2>Admin Panel – Upload Seating Excel</h2>

<h3>FN Session</h3>
<input type="file" id="FN_file" accept=".xlsx,.xls">
<button onclick="uploadExcel('FN')">Upload FN</button>

<h3>AN Session</h3>
<input type="file" id="AN_file" accept=".xlsx,.xls">
<button onclick="uploadExcel('AN')">Upload AN</button>

<script>
async function uploadExcel(session) {
  try {
    const fileInput = document.getElementById(session + "_file");
    const file = fileInput.files[0];
    if (!file) return alert("Select an Excel file");

    const buffer = await file.arrayBuffer();
    const workbook = XLSX.read(buffer, { type: "array" });

    let finalData = [];

    workbook.SheetNames.forEach(sheetName => {
      const sheet = workbook.Sheets[sheetName];

      // READ USING HEADERS (KEEP AS-IS)
      const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });

      // 🔥 EXTRACT HALL FROM FIRST FEW ROWS (FIX)
      let detectedHall = "";

      for (let i = 0; i < 5 && i < rows.length; i++) {
        for (const key in rows[i]) {
          const cell = String(rows[i][key] || "");
          if (cell.toUpperCase().includes("HALL NO")) {
            detectedHall = cell.split(":")[1]?.trim() || "";
            break;
          }
        }
        if (detectedHall) break;
      }

      rows.forEach(row => {
        const reg =
          row["REGISTER NO"] ||
          row["REGISTER NUMBER"] ||
          row["Register No"] ||
          row["Reg No"];

        const name =
          row["STUDENT NAME"] ||
          row["NAME"] ||
          row["Student Name"];

        const seat =
          row["DESK NO"] ||
          row["SEAT"] ||
          row["Desk No"];

        if (!reg || !name || !seat) return;

        finalData.push({
          "REGISTER NUMBER": String(reg).trim().toUpperCase(),
          "NAME": String(name).trim(),
          "SEAT": String(seat).trim(),
          "HALL": detectedHall || sheetName
        });
      });
    });

    if (!finalData.length) {
      alert("No valid seating data found");
      return;
    }

    const res = await fetch(
      "https://seat-finder-api.harjeetgowda644.workers.dev/admin/upload",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session, data: finalData })
      }
    );

    if (!res.ok) throw new Error("Upload failed");

    alert(`${session} uploaded successfully (${finalData.length} records)`);
    fileInput.value = "";

  } catch (err) {
    console.error(err);
    alert("Upload failed – check console");
  }
}
</script>






</body>
</html>
