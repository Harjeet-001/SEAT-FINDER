<!DOCTYPE html>
<html>
<head>
  <title>Admin – Upload Seating Data</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body>

<h2>Admin Panel – Upload Seating Excel</h2>

<h3>FN Session</h3>
<input type="file" id="FN_file" accept=".xlsx,.xls">
<button onclick="uploadExcel('FN')">Upload FN</button>

<h3>AN Session</h3>
<input type="file" id="AN_file" accept=".xlsx,.xls">
<button onclick="uploadExcel('AN')">Upload AN</button>

<script>
async function uploadExcel(session) {
  try {
    alert("uploadExcel() called for " + session);

    const fileInput = document.getElementById(session + "_file");
    const file = fileInput.files[0];
    if (!file) {
      alert("Select an Excel file");
      return;
    }

    const buffer = await file.arrayBuffer();
    const workbook = XLSX.read(buffer, { type: "array" });

    let finalData = [];

    workbook.SheetNames.forEach(sheetName => {
      const sheet = workbook.Sheets[sheetName];

      // ✅ RAW ROWS (THIS IS THE KEY)
      const rows = XLSX.utils.sheet_to_json(sheet, {
        header: 1,
        defval: ""
      });

      if (!rows.length) return;

      // 🔎 FIND HEADER ROW
      let headerIndex = -1;

      for (let i = 0; i < rows.length; i++) {
        if (
          rows[i].includes("REGISTER NO") &&
          rows[i].includes("STUDENT NAME") &&
          rows[i].includes("DESK NO")
        ) {
          headerIndex = i;
          break;
        }
      }

      if (headerIndex === -1) return;

      const headers = rows[headerIndex];

      const regIdx = headers.indexOf("REGISTER NO");
      const nameIdx = headers.indexOf("STUDENT NAME");
      const seatIdx = headers.indexOf("DESK NO");

      // 🔥 EXTRACT HALL FROM TOP ROWS
      let detectedHall = "";

      for (let i = 0; i < headerIndex; i++) {
        for (const cell of rows[i]) {
          const text = String(cell || "");
          if (text.toUpperCase().includes("HALL NO")) {
            detectedHall = text.split(":")[1]?.trim();
          }
        }
      }

      // ✅ READ DATA ROWS
      for (let i = headerIndex + 1; i < rows.length; i++) {
        const row = rows[i];

        const reg = row[regIdx];
        const name = row[nameIdx];
        const seat = row[seatIdx];

        if (!reg || !name || !seat) continue;

        finalData.push({
          "REGISTER NUMBER": String(reg).trim().toUpperCase(),
          "NAME": String(name).trim(),
          "SEAT": String(seat).trim(),
          "HALL": detectedHall || sheetName
        });
      }
    });

    if (!finalData.length) {
      alert("❌ No valid seating data found");
      return;
    }

    alert("✅ Parsed records: " + finalData.length);

    const res = await fetch(
      "https://seat-finder-api.harjeetgowda644.workers.dev/admin/upload",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session, data: finalData })
      }
    );

    if (!res.ok) throw new Error("Upload failed");

    alert(`✅ ${session} uploaded successfully (${finalData.length} records)`);
    fileInput.value = "";

  } catch (err) {
    console.error(err);
    alert("❌ Upload failed – check console");
  }
}
</script>

</body>
</html>
