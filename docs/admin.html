<!DOCTYPE html>
<html>
<head>
  <title>Admin – Upload Seating Data</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body>

<h2>Admin Panel – Upload Seating Excel</h2>

<h3>FN Session</h3>
<input type="file" id="FN_file" accept=".xlsx,.xls">
<button onclick="uploadExcel('FN')">Upload FN</button>

<h3>AN Session</h3>
<input type="file" id="AN_file" accept=".xlsx,.xls">
<button onclick="uploadExcel('AN')">Upload AN</button>

<script>
async function uploadExcel(session) {
  const fileInput = document.getElementById(session + "_file");
  const file = fileInput.files[0];

  if (!file) {
    alert("Select an Excel file");
    return;
  }

  const buffer = await file.arrayBuffer();
  const workbook = XLSX.read(buffer);

  const regPattern = /^[0-9]{2}[A-Z]{2,}[0-9]+$/;
  let finalData = [];

  workbook.SheetNames.forEach(sheetName => {
    const sheet = workbook.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });

    let hallName = "";

    // First pass: find hall name anywhere
    rows.forEach(r => {
      r.forEach(cell => {
        const val = String(cell).toUpperCase();
        if (val.includes("HALL")) {
          hallName = cell.toString().trim();
        }
      });
    });

    // Second pass: find register numbers
    rows.forEach(r => {
      r.forEach((cell, idx) => {
        const value = String(cell).trim().toUpperCase();

        if (regPattern.test(value)) {
          const seat =
            r[idx + 1] || r[idx - 1] || "";

          finalData.push({
            "REGISTER NUMBER": value,
            "NAME": r[idx + 2] ? String(r[idx + 2]).trim() : "",
            "SEAT": String(seat).trim(),
            "HALL": hallName
          });
        }
      });
    });
  });

  if (!finalData.length) {
    alert("No valid seating data found");
    return;
  }

  const res = await fetch(
    "https://seat-finder-api.harjeetgowda644.workers.dev/admin/upload",
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        session,
        data: finalData
      })
    }
  );

  const out = await res.json();

  if (out.status === "ok") {
    alert(session + " uploaded successfully");
    fileInput.value = "";
  } else {
    alert("Upload failed");
  }
}
</script>





</body>
</html>
