<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin – Upload Seating Data</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #bfefff, #d9f4ff);
      font-family: "Segoe UI", system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #0f172a;
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      width: 420px;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #1e3a8a;
    }

    h3 {
      margin-top: 20px;
      margin-bottom: 8px;
      color: #2563eb;
    }

    input[type="file"] {
      width: 100%;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 1.05rem;
      font-weight: 700;
      color: white;
      background: #3574b6;
      border: none;
      border-radius: 14px;
      cursor: pointer;
    }

    button:hover {
      background: #1e5fa3;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>Admin Panel</h2>

  <h3>FN Session</h3>
  <input type="file" id="FN_file" accept=".xlsx,.xls">
  <button onclick="uploadExcel('FN')">Upload FN</button>

  <h3>AN Session</h3>
  <input type="file" id="AN_file" accept=".xlsx,.xls">
  <button onclick="uploadExcel('AN')">Upload AN</button>
</div>

<script>
async function uploadExcel(session) {
  try {
    const fileInput = document.getElementById(session + "_file");
    const file = fileInput.files[0];
    if (!file) {
      alert("Select an Excel file first");
      return;
    }

    const buffer = await file.arrayBuffer();
    const workbook = XLSX.read(buffer, { type: "array" });

    let finalData = [];

    workbook.SheetNames.forEach(sheetName => {
      const sheet = workbook.Sheets[sheetName];

      /* ---------------- EXTRACT HALL NO (HEADER AREA) ---------------- */
      let detectedHall = "";
      const range = XLSX.utils.decode_range(sheet["!ref"]);

      for (let r = range.s.r; r <= Math.min(range.s.r + 5, range.e.r); r++) {
        for (let c = range.s.c; c <= range.e.c; c++) {
          const addr = XLSX.utils.encode_cell({ r, c });
          const cell = sheet[addr];
          if (!cell || !cell.v) continue;

          const value = String(cell.v).toUpperCase().trim();
          if (value === "HALL NO:" || value === "HALL NO") {
            const rightCell = sheet[
              XLSX.utils.encode_cell({ r, c: c + 1 })
            ];
            if (rightCell && rightCell.v) {
              detectedHall = String(rightCell.v).trim();
              break;
            }
          }
        }
        if (detectedHall) break;
      }

      /* ---------------- READ TABLE DATA (UNCHANGED LOGIC) ---------------- */
      const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });

      rows.forEach(row => {
        const reg =
          row["REGISTER NO"] ||
          row["REGISTER NUMBER"] ||
          row["Register No"] ||
          row["Reg No"];

        const name =
          row["STUDENT NAME"] ||
          row["NAME"] ||
          row["Student Name"];

        const seat =
          row["DESK NO"] ||
          row["SEAT"] ||
          row["Desk No"];

        if (!reg || !name || !seat) return;

        finalData.push({
          "REGISTER NUMBER": String(reg).trim().toUpperCase(),
          "NAME": String(name).trim(),
          "SEAT": String(seat).trim(),
          "HALL": detectedHall || sheetName
        });
      });
    });

    if (!finalData.length) {
      alert("No valid seating data found");
      return;
    }

    const res = await fetch(
      "https://seat-finder-api.harjeetgowda644.workers.dev/admin/upload",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session, data: finalData })
      }
    );

    if (!res.ok) throw new Error("Upload failed");

    alert(`${session} uploaded successfully (${finalData.length} records)`);
    fileInput.value = "";

  } catch (err) {
    console.error(err);
    alert("Upload failed – check console");
  }
}
</script>

</body>
</html>
