<!DOCTYPE html>
<html>
<head>
  <title>Admin – Upload Seating Data</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body>

<h2>Admin Panel – Upload Seating Excel</h2>

<h3>FN Session</h3>
<input type="file" id="FN_file" accept=".xlsx,.xls">
<button onclick="uploadExcel('FN')">Upload FN</button>

<h3>AN Session</h3>
<input type="file" id="AN_file" accept=".xlsx,.xls">
<button onclick="uploadExcel('AN')">Upload AN</button>

<script>
async function uploadExcel(session) {
  try {
    const fileInput = document.getElementById(session + "_file");
    const file = fileInput.files[0];
    if (!file) return alert("Select an Excel file");

    const buffer = await file.arrayBuffer();
    const workbook = XLSX.read(buffer, { type: "array" });

    /* =====================================================
       STEP 1: EXTRACT HALL + SIDE FROM FIRST SHEET ONLY
       ===================================================== */
    let hall = "";
    let side = "";

    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
    const firstRows = XLSX.utils.sheet_to_json(firstSheet, {
      header: 1,
      defval: ""
    });

    for (let i = 0; i < 10; i++) {
      for (let j = 0; j < firstRows[i].length; j++) {
        const cell = String(firstRows[i][j]).toUpperCase();

        // HALL
        if (cell.includes("HALL") && cell.includes("FLOOR")) {
          hall = String(firstRows[i][j])
            .split(":")
            .slice(1)
            .join(":")
            .trim();
        }

        // SIDE (LEFT / RIGHT)
        if (cell.includes("LEFT")) side = "LEFT";
        if (cell.includes("RIGHT")) side = "RIGHT";
      }
    }

    if (!hall) {
      alert("Hall not found in first sheet. Check Excel format.");
      return;
    }

    /* =====================================================
       STEP 2: READ STUDENT DATA FROM ALL SHEETS
       ===================================================== */
    let finalData = [];

    workbook.SheetNames.forEach(sheetName => {
      const sheet = workbook.Sheets[sheetName];

      const rows = XLSX.utils.sheet_to_json(sheet, {
        defval: ""
      });

      rows.forEach(row => {
        const reg =
          row["REGISTER NO"] ||
          row["REGISTER NUMBER"] ||
          row["Reg No"];

        const name =
          row["STUDENT NAME"] ||
          row["NAME"];

        const seat =
          row["DESK NO"] ||
          row["SEAT"];

        if (!reg || !name || !seat) return;

        finalData.push({
          "REGISTER NUMBER": String(reg).trim().toUpperCase(),
          "NAME": String(name).trim(),
          "SEAT": String(seat).trim(),
          "HALL": hall,
          "SIDE": side
        });
      });
    });

    if (!finalData.length) {
      alert("No valid seating data found");
      return;
    }

    /* =====================================================
       STEP 3: UPLOAD TO CLOUDFLARE
       ===================================================== */
    const res = await fetch(
      "https://seat-finder-api.harjeetgowda644.workers.dev/admin/upload",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session, data: finalData })
      }
    );

    if (!res.ok) throw new Error("Upload failed");

    alert(`${session} uploaded successfully (${finalData.length} records)`);
    fileInput.value = "";

  } catch (err) {
    console.error(err);
    alert("Upload failed – check console");
  }
}
</script>

</body>
</html>
