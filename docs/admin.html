<!DOCTYPE html>
<html>
<head>
  <title>Admin – Upload Seating Data</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body>

<h2>Admin Panel – Upload Seating Excel</h2>

<h3>FN Session</h3>
<input type="file" id="FN_file" accept=".xlsx,.xls">
<button onclick="uploadExcel('FN')">Upload FN</button>

<h3>AN Session</h3>
<input type="file" id="AN_file" accept=".xlsx,.xls">
<button onclick="uploadExcel('AN')">Upload AN</button>

<script>
async function uploadExcel(session) {
  const fileInput = document.getElementById(session + "_file");
  const file = fileInput.files[0];

  if (!file) {
    alert("Select an Excel file");
    return;
  }

  const buffer = await file.arrayBuffer();
  const workbook = XLSX.read(buffer);

  let finalData = [];

  workbook.SheetNames.forEach(sheetName => {
    const sheet = workbook.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });

    if (!rows || rows.length < 5) return;

    // ---- FIND HEADER ROW ----
    let headerRowIndex = -1;
    for (let i = 0; i < rows.length; i++) {
      const row = rows[i].map(c => String(c).toUpperCase());
      if (
        row.some(c => c.includes("REG")) &&
        row.some(c => c.includes("NAME")) &&
        row.some(c => c.includes("SEAT"))
      ) {
        headerRowIndex = i;
        break;
      }
    }

    if (headerRowIndex === -1) return;

    const headers = rows[headerRowIndex].map(h =>
      String(h).trim().toUpperCase()
    );

    const colIndex = {
      reg: headers.findIndex(h => h.includes("REG")),
      name: headers.findIndex(h => h.includes("NAME")),
      seat: headers.findIndex(h => h.includes("SEAT")),
      hall: headers.findIndex(h => h.includes("HALL"))
    };

    // ---- READ DATA ROWS ----
    for (let i = headerRowIndex + 1; i < rows.length; i++) {
      const r = rows[i];
      const reg = r[colIndex.reg];
      const name = r[colIndex.name];

      if (!reg || !name) continue;

      finalData.push({
        "REGISTER NUMBER": String(reg).trim(),
        "NAME": String(name).trim(),
        "SEAT": colIndex.seat !== -1 ? String(r[colIndex.seat]).trim() : "",
        "HALL": colIndex.hall !== -1 ? String(r[colIndex.hall]).trim() : ""
      });
    }
  });

  if (!finalData.length) {
    alert("No valid seating data found");
    return;
  }

  const res = await fetch(
    "https://seat-finder-api.harjeetgowda644.workers.dev/admin/upload",
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        session,
        data: finalData
      })
    }
  );

  const out = await res.json();

  if (out.status === "ok") {
    alert(session + " uploaded successfully");
    fileInput.value = "";
  } else {
    alert("Upload failed");
  }
}
</script>




</body>
</html>
