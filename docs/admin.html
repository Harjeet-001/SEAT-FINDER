<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin – Upload Seating Data</title>

  <!-- XLSX LIBRARY (DO NOT TOUCH) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(180deg, #eaf7ff, #f5fbff);
      color: #0f172a;
    }

    .glass {
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    .admin-container {
      width: 420px;
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.18);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      letter-spacing: 1px;
      font-weight: 700;
      color: #0f172a;
    }

    .session-box {
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(15, 23, 42, 0.12);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .session-box h3 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 15px;
      font-weight: 600;
      color: #1e40af;
    }

    .tab-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .tab-btn {
      flex: 1;
      padding: 7px 0;
      border: 1.5px solid #cbd5f5;
      border-radius: 8px;
      background: #f0f4ff;
      color: #475569;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      width: auto;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      border-color: transparent;
    }

    .tab-btn:hover:not(.active) {
      background: #dbeafe;
      border-color: #93c5fd;
    }

    .upload-panel { display: none; }
    .upload-panel.active { display: block; }

    input[type="file"] {
      width: 100%;
      margin-bottom: 12px;
      padding: 8px;
      background: #ffffff;
      color: #0f172a;
      border: 1px solid #cbd5f5;
      border-radius: 8px;
    }

    button.upload-btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button.upload-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(37,99,235,0.35);
    }

    button.upload-btn:active {
      transform: translateY(0);
      box-shadow: none;
    }

    .status-log {
      margin-top: 10px;
      font-size: 11.5px;
      color: #334155;
      background: #f1f5f9;
      border-radius: 8px;
      padding: 8px 10px;
      max-height: 88px;
      overflow-y: auto;
      display: none;
      line-height: 1.7;
    }
    .status-log.show { display: block; }

    .footer-note {
      margin-top: 14px;
      text-align: center;
      font-size: 11px;
      color: #475569;
      opacity: 0.85;
    }
  </style>
</head>

<body>

<div class="admin-container glass">
  <h2>ADMIN – SEATING UPLOAD</h2>

  <!-- FN SESSION -->
  <div class="session-box">
    <h3>FN Session</h3>
    <div class="tab-row">
      <button class="tab-btn active" onclick="switchTab('FN','xlsx',this)">📊 Excel</button>
      <button class="tab-btn"        onclick="switchTab('FN','pdf',this)">📄 PDF</button>
    </div>
    <div id="FN_xlsx_panel" class="upload-panel active">
      <input type="file" id="FN_file" accept=".xlsx,.xls">
      <button class="upload-btn" onclick="uploadExcel('FN')">Upload FN</button>
    </div>
    <div id="FN_pdf_panel" class="upload-panel">
      <input type="file" id="FN_pdf_file" accept=".pdf">
      <button class="upload-btn" onclick="uploadPDF('FN')">Upload FN PDF</button>
    </div>
    <div id="FN_log" class="status-log"></div>
  </div>

  <!-- AN SESSION -->
  <div class="session-box">
    <h3>AN Session</h3>
    <div class="tab-row">
      <button class="tab-btn active" onclick="switchTab('AN','xlsx',this)">📊 Excel</button>
      <button class="tab-btn"        onclick="switchTab('AN','pdf',this)">📄 PDF</button>
    </div>
    <div id="AN_xlsx_panel" class="upload-panel active">
      <input type="file" id="AN_file" accept=".xlsx,.xls">
      <button class="upload-btn" onclick="uploadExcel('AN')">Upload AN</button>
    </div>
    <div id="AN_pdf_panel" class="upload-panel">
      <input type="file" id="AN_pdf_file" accept=".pdf">
      <button class="upload-btn" onclick="uploadPDF('AN')">Upload AN PDF</button>
    </div>
    <div id="AN_log" class="status-log"></div>
  </div>

  <div class="footer-note">
    Admin panel • Excel (.xlsx / .xls) or PDF
  </div>
</div>

<script>
// ── PDF.js worker ──────────────────────────────────────────────────────────
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const API_BASE = "https://seat-finder-api.harjeetgowda644.workers.dev";

// ── Tab switcher ───────────────────────────────────────────────────────────
function switchTab(session, type, btn) {
  btn.parentElement.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById(`${session}_xlsx_panel`).classList.toggle("active", type === "xlsx");
  document.getElementById(`${session}_pdf_panel`).classList.toggle("active",  type === "pdf");
  clearLog(session);
}

// ── Log helpers ────────────────────────────────────────────────────────────
function clearLog(session) {
  const el = document.getElementById(`${session}_log`);
  el.innerHTML = "";
  el.classList.remove("show");
}
function log(session, msg) {
  const el = document.getElementById(`${session}_log`);
  el.classList.add("show");
  el.innerHTML += msg + "<br>";
  el.scrollTop = el.scrollHeight;
}

// ═══════════════════════════════════════════════════════════════════════════
// EXCEL UPLOAD  ── original code, completely unchanged
// ═══════════════════════════════════════════════════════════════════════════
async function uploadExcel(session) {
  try {
    const fileInput = document.getElementById(session + "_file");
    const file = fileInput.files[0];
    if (!file) {
      alert("NO FILE SELECTED");
      return;
    }

    const buffer = await file.arrayBuffer();
    const workbook = XLSX.read(buffer, { type: "array" });
    let finalData = [];

    workbook.SheetNames.forEach(sheetName => {
      const sheet = workbook.Sheets[sheetName];
      const matrix = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });

      // ----- HALL DETECTION (UNCHANGED) -----
      let detectedHall = "";
      const merges = sheet["!merges"] || [];
      let hallLabelCell = null;

      for (const addr in sheet) {
        if (addr[0] === "!") continue;
        const cell = sheet[addr];
        if (cell.v && String(cell.v).trim().toUpperCase() === "HALL NO:") {
          hallLabelCell = XLSX.utils.decode_cell(addr);
          break;
        }
      }

      if (hallLabelCell) {
        for (const m of merges) {
          if (
            m.s.r === hallLabelCell.r &&
            hallLabelCell.c >= m.s.c &&
            hallLabelCell.c <= m.e.c
          ) {
            const nextMerge = merges.find(n =>
              n.s.r === m.s.r && n.s.c > m.e.c
            );
            if (nextMerge) {
              const hallAddr = XLSX.utils.encode_cell({
                r: nextMerge.s.r,
                c: nextMerge.s.c
              });
              detectedHall = String(sheet[hallAddr]?.v || "").trim();
            }
            break;
          }
        }
      }

      // ----- HEADER DETECTION -----
      let headerRow = -1;
      for (let i = 0; i < matrix.length; i++) {
        if (
          matrix[i].includes("REGISTER NO") &&
          matrix[i].includes("STUDENT NAME") &&
          matrix[i].includes("DESK NO")
        ) {
          headerRow = i;
          break;
        }
      }

      // ----- SIDE DETECTION (MERGE-BASED, ACTUALLY CORRECT) -----
      let detectedSide = "";
      const mergesAboveHeader = (sheet["!merges"] || []).filter(m => m.e.r < headerRow);

      for (const m of mergesAboveHeader) {
        const addr = XLSX.utils.encode_cell({ r: m.s.r, c: m.s.c });
        const cell = sheet[addr];
        if (!cell || !cell.v) continue;
        const raw = String(cell.v).toUpperCase().replace(/\s+/g, " ").trim();
        if (raw.includes("LEFT"))  { detectedSide = "LEFT";  break; }
        if (raw.includes("RIGHT")) { detectedSide = "RIGHT"; break; }
      }

      if (!detectedSide) {
        console.warn(`❌ SIDE NOT FOUND (MERGE READ FAILED) | sheet=${sheetName}`);
      }

      if (headerRow === -1) return;

      const headers = matrix[headerRow];
      const r = headers.indexOf("REGISTER NO");
      const n = headers.indexOf("STUDENT NAME");
      const s = headers.indexOf("DESK NO");

      for (let i = headerRow + 1; i < matrix.length; i++) {
        const row = matrix[i];
        if (!row[r] || !row[n] || !row[s]) continue;

        finalData.push({
          "REGISTER NUMBER": String(row[r]).trim().toUpperCase(),
          "NAME": String(row[n]).trim(),
          "SEAT": String(row[s]).trim(),
          "HALL": detectedHall,
          "SIDE": detectedSide
        });
      }
    });

    if (finalData.length === 0) {
      alert("❌ NO VALID SEATING DATA FOUND");
      return;
    }

    const res = await fetch(
      `${API_BASE}/admin/upload`,
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session, data: finalData })
      }
    );

    if (!res.ok) throw new Error("UPLOAD FAILED");

    alert(`✅ ${session} UPLOADED (${finalData.length} RECORDS)`);

  } catch (err) {
    console.error(err);
    alert("❌ ERROR – CHECK CONSOLE");
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// PDF UPLOAD
// ═══════════════════════════════════════════════════════════════════════════
async function uploadPDF(session) {
  clearLog(session);
  try {
    const fileInput = document.getElementById(`${session}_pdf_file`);
    const file = fileInput.files[0];
    if (!file) { alert("NO FILE SELECTED"); return; }

    log(session, "📄 Reading PDF…");
    const buffer     = await file.arrayBuffer();
    const pdfDoc     = await pdfjsLib.getDocument({ data: buffer }).promise;
    const totalPages = pdfDoc.numPages;
    log(session, `📑 ${totalPages} pages found. Parsing…`);

    const finalData = [];

    for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
      const page    = await pdfDoc.getPage(pageNum);
      const content = await page.getTextContent();

      const items = content.items
        .map(i => ({ text: i.str, x: i.transform[4], y: i.transform[5] }))
        .filter(i => i.text.trim().length > 0);

      if (items.length === 0) continue;

      // ── 1. SIDE ──────────────────────────────────────────────────────────
      // Comes as a single token: "LEFT SIDE" or "RIGHT SIDE"
      let detectedSide = "";
      for (const item of items) {
        const t = item.text.trim().toUpperCase();
        if (t.includes("LEFT SIDE")  || t === "LEFT")  { detectedSide = "LEFT";  break; }
        if (t.includes("RIGHT SIDE") || t === "RIGHT") { detectedSide = "RIGHT"; break; }
      }

      // ── 2. HALL ──────────────────────────────────────────────────────────
      // "HALL NO:" is one token; hall value is a separate nearby token
      let detectedHall = "";
      const hallItem = items.find(i => i.text.trim() === "HALL NO:");
      if (hallItem) {
        const SKIP = new Set(["LEFT SIDE","RIGHT SIDE","LEFT","RIGHT","SIDE",
                               "NAME","SIGNATURE","OF","THE","INVIGILATOR"]);
        let best = null, bestDist = 999;
        for (const item of items) {
          if (item === hallItem) continue;
          const t = item.text.trim().toUpperCase();
          if (SKIP.has(t) || t.length > 12 || t.length === 0) continue;
          if (!/^[A-Z0-9\s]+$/.test(t)) continue;
          const dx = Math.abs(item.x - hallItem.x);
          const dy = Math.abs(item.y - hallItem.y);
          if (dx > 150 || dy > 30) continue;
          const dist = dx + dy;
          if (dist < bestDist) { bestDist = dist; best = item; }
        }
        if (best) detectedHall = best.text.trim();
      }

      // ── 3. HEADER ROW ────────────────────────────────────────────────────
      const regHeaderItem = items.find(i => i.text.trim() === "REGISTER NO");
      if (!regHeaderItem) continue; // blank page

      const headerY = regHeaderItem.y;

      let deskX = null, regX = null, nameX = null;
      for (const item of items) {
        if (Math.abs(item.y - headerY) > 8) continue;
        const t = item.text.trim().toUpperCase();
        if (t === "DESK" || t === "DESK NO") deskX = item.x;
        if (t === "REGISTER NO")             regX  = item.x;
        if (t === "STUDENT NAME")            nameX = item.x;
      }
      if (deskX === null) deskX = regX ? regX - 30 : 88;
      if (regX  === null) regX  = 121;
      if (nameX === null) nameX = 274;

      // regNameMid = regX + 40 (NOT midpoint — midpoint swallows names into reg)
      const deskRegMid = (deskX + regX) / 2;
      const regNameMid = regX + 40;

      // ── 4. COLLECT RAW ITEMS BELOW HEADER ────────────────────────────────
      // Only items below headerY - 10 (excludes split "NO" token of "DESK NO")
      // Only items with x >= 75 (excludes left-margin class labels like "III B.COM")
      const dataItems = items.filter(i => i.y < headerY - 10 && i.x >= 75);

      // ── 5. BUILD ROW MAP with 5pt buckets ────────────────────────────────
      const rowMap = {};
      for (const item of dataItems) {
        const key = Math.round(item.y / 5) * 5;
        rowMap[key] = rowMap[key] || [];
        rowMap[key].push(item);
      }

      // ── 6. PARSE each bucket into { desk, reg, name } ────────────────────
      const parsed = {}; // key → { desk, reg, name }
      for (const [keyStr, rowItems] of Object.entries(rowMap)) {
        const key = Number(keyStr);
        rowItems.sort((a, b) => a.x - b.x);
        let desk = "", reg = "", name = "";
        for (const item of rowItems) {
          const t = item.text.trim();
          if (!t) continue;
          if      (item.x < deskRegMid) desk += t + " ";
          else if (item.x < regNameMid) reg  += t + " ";
          else                          name += t + " ";
        }
        parsed[key] = {
          desk: desk.trim(),
          reg:  reg.trim(),
          name: name.trim()
        };
      }

      // ── 7. MERGE SPLIT ROWS ───────────────────────────────────────────────
      // Some rows have desk number at a slightly different Y than reg+name.
      // e.g. desk="1" at bucket=830, reg="232AA2271" name="PRABAVATHI G" at bucket=840
      // Fix: if a bucket has ONLY a valid desk number (no reg/name), look for
      // a neighbouring bucket within 15pt that has reg+name but no desk, and merge them.
      const sortedKeys = Object.keys(parsed).map(Number).sort((a, b) => b - a);

      for (const key of sortedKeys) {
        const row = parsed[key];
        // This bucket has only a desk number — no reg or name
        if (/^\d{1,2}$/.test(row.desk) && !row.reg && !row.name) {
          // Find the nearest bucket within 15pt that has reg+name but no desk
          let bestKey = null, bestGap = 999;
          for (const otherKey of sortedKeys) {
            if (otherKey === key) continue;
            const other = parsed[otherKey];
            const gap = Math.abs(otherKey - key);
            if (gap <= 15 && other.reg && other.name && !other.desk && gap < bestGap) {
              bestGap = gap;
              bestKey = otherKey;
            }
          }
          if (bestKey !== null) {
            // Merge: give the desk number to the reg+name bucket, remove this one
            parsed[bestKey].desk = row.desk;
            delete parsed[key];
          }
        }
      }

      // ── 8. VALIDATE AND COLLECT ───────────────────────────────────────────
      let rowsParsed = 0;
      const finalKeys = Object.keys(parsed).map(Number).sort((a, b) => b - a);

      for (const key of finalKeys) {
        const { desk, reg, name } = parsed[key];

        if (!desk || !/^\d{1,2}$/.test(desk))               continue;
        if (!reg  || reg.length < 6)                         continue;
        if (!/^[A-Z0-9]+$/i.test(reg.replace(/\s+/g, "")))  continue;
        if (!name)                                            continue;

        // Skip footer lines
        const nu = name.toUpperCase();
        if (nu.includes("KUMARAGURU") || nu.includes("INVIGILATOR") ||
            nu.includes("SEATING")    || nu.includes("EXAMINATION")) continue;

        finalData.push({
          "REGISTER NUMBER": reg.replace(/\s+/g, "").toUpperCase(),
          "NAME": name.trim(),
          "SEAT": desk,
          "HALL": detectedHall,
          "SIDE": detectedSide
        });
        rowsParsed++;
      }

      if (rowsParsed > 0) {
        log(session, `✔ Page ${pageNum}: ${detectedHall} ${detectedSide} → ${rowsParsed} rows`);
      }
    }

    if (finalData.length === 0) {
      log(session, "❌ No valid data found. Is this the correct seating plan PDF?");
      return;
    }

    log(session, `📦 ${finalData.length} records total. Uploading…`);

    const res = await fetch(`${API_BASE}/admin/upload`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session, data: finalData })
    });

    if (!res.ok) {
      const txt = await res.text().catch(() => res.status);
      throw new Error(`HTTP ${res.status}: ${txt}`);
    }

    log(session, `✅ ${session} UPLOADED (${finalData.length} RECORDS)`);

  } catch (err) {
    console.error(err);
    log(session, "❌ ERROR: " + err.message);
  }
}
</script>

</body>
</html>
