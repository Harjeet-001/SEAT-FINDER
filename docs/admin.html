<!DOCTYPE html>
<html>
<head>
  <title>Admin – Upload Seating Data</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body>

<h2>Admin Panel – Upload Seating Excel</h2>

<h3>FN Session</h3>
<input type="file" id="FN_file" accept=".xlsx,.xls">
<button onclick="uploadExcel('FN')">Upload FN</button>

<h3>AN Session</h3>
<input type="file" id="AN_file" accept=".xlsx,.xls">
<button onclick="uploadExcel('AN')">Upload AN</button>

<script>
async function uploadExcel(session) {
  try {
    const fileInput = document.getElementById(session + "_file");
    const file = fileInput.files[0];

    if (!file) {
      alert("Select an Excel file first");
      return;
    }

    const buffer = await file.arrayBuffer();
    const workbook = XLSX.read(buffer);
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet);

    if (!rows.length) {
      alert("Excel file is empty");
      return;
    }

    const res = await fetch(
      "https://seat-finder-api.harjeetgowda644.workers.dev/admin/upload",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          session: session,
          data: rows
        })
      }
    );

    if (!res.ok) {
      throw new Error("Server error");
    }

    const out = await res.json();

    if (out.status === "ok") {
      alert(session + " upload successful");
      fileInput.value = ""; // reset input
    } else {
      alert("Upload failed");
    }

  } catch (err) {
    console.error(err);
    alert("Upload failed – check console");
  }
}
</script>

</body>
</html>
