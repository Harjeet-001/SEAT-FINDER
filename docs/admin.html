<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin – Upload Seating Data</title>

  <!-- XLSX -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --primary: #1e3a8a;   /* deep blue */
      --accent: #2563eb;   /* button blue */
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    header {
      background: var(--primary);
      color: white;
      padding: 18px 32px;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .card {
      background: var(--card);
      border-radius: 10px;
      padding: 28px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }

    .card h3 {
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 18px;
    }

    .upload-row {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    input[type="file"] {
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      flex: 1;
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s ease;
      white-space: nowrap;
    }

    button:hover {
      background: #1d4ed8;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-top: 40px;
    }
  </style>
</head>

<body>

<header>
  Admin Panel · Seating Upload
</header>

<div class="container">

  <div class="card">
    <h3>FN Session Upload</h3>
    <div class="upload-row">
      <input type="file" id="FN_file" accept=".xlsx,.xls">
      <button onclick="uploadExcel('FN')">Upload FN</button>
    </div>
  </div>

  <div class="card">
    <h3>AN Session Upload</h3>
    <div class="upload-row">
      <input type="file" id="AN_file" accept=".xlsx,.xls">
      <button onclick="uploadExcel('AN')">Upload AN</button>
    </div>
  </div>

</div>

<footer>
  Seat Allocation System · Admin
</footer>

<script>
async function uploadExcel(session) {
  try {
    const fileInput = document.getElementById(session + "_file");
    const file = fileInput.files[0];
    if (!file) return alert("Select an Excel file");

    const buffer = await file.arrayBuffer();
    const workbook = XLSX.read(buffer, { type: "array" });

    let finalData = [];

    workbook.SheetNames.forEach(sheetName => {
      const sheet = workbook.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });

      let detectedHall = "";

      for (let i = 0; i < 5 && i < rows.length; i++) {
        for (const key in rows[i]) {
          const cell = String(rows[i][key] || "");
          if (cell.toUpperCase().includes("HALL NO")) {
            detectedHall = cell.split(":")[1]?.trim() || "";
            break;
          }
        }
        if (detectedHall) break;
      }

      rows.forEach(row => {
        const reg =
          row["REGISTER NO"] ||
          row["REGISTER NUMBER"] ||
          row["Register No"] ||
          row["Reg No"];

        const name =
          row["STUDENT NAME"] ||
          row["NAME"] ||
          row["Student Name"];

        const seat =
          row["DESK NO"] ||
          row["SEAT"] ||
          row["Desk No"];

        if (!reg || !name || !seat) return;

        finalData.push({
          "REGISTER NUMBER": String(reg).trim().toUpperCase(),
          "NAME": String(name).trim(),
          "SEAT": String(seat).trim(),
          "HALL": detectedHall || sheetName
        });
      });
    });

    if (!finalData.length) {
      alert("No valid seating data found");
      return;
    }

    const res = await fetch(
      "https://seat-finder-api.harjeetgowda644.workers.dev/admin/upload",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session, data: finalData })
      }
    );

    if (!res.ok) throw new Error("Upload failed");

    alert(`${session} uploaded successfully (${finalData.length} records)`);
    fileInput.value = "";

  } catch (err) {
    console.error(err);
    alert("Upload failed – check console");
  }
}
</script>

</body>
</html>
