<!DOCTYPE html>
<html>
<head>
  <title>Admin – Upload Seating Data</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body>

<h2>Admin Panel – Upload Seating Excel</h2>

<h3>FN Session</h3>
<input type="file" id="FN_file" accept=".xlsx,.xls">
<button onclick="uploadExcel('FN')">Upload FN</button>

<h3>AN Session</h3>
<input type="file" id="AN_file" accept=".xlsx,.xls">
<button onclick="uploadExcel('AN')">Upload AN</button>

<script>
async function uploadExcel(session) {
  try {
    const fileInput = document.getElementById(session + "_file");
    const file = fileInput.files[0];
    if (!file) return alert("Select an Excel file");

    const buffer = await file.arrayBuffer();
    const workbook = XLSX.read(buffer, { type: "array" });

    let finalData = [];

    workbook.SheetNames.forEach(sheetName => {
      const sheet = workbook.Sheets[sheetName];

      // READ FULL SHEET AS MATRIX
      const rows = XLSX.utils.sheet_to_json(sheet, {
        header: 1,
        defval: ""
      });

      let hall = "";
      let headerRowIndex = -1;
      let colIndex = {};

      // 🔍 FIND HALL + HEADER ROW
      for (let i = 0; i < rows.length; i++) {
        for (let j = 0; j < rows[i].length; j++) {
          const cell = String(rows[i][j]).toUpperCase();

          if (cell.includes("HALL NO")) {
            hall = String(rows[i][j + 1] || "")
              .replace(/\n/g, " ")
              .trim();
          }

          if (cell === "REGISTER NO") {
            headerRowIndex = i;
            rows[i].forEach((h, idx) => {
              colIndex[String(h).toUpperCase().trim()] = idx;
            });
          }
        }
        if (hall && headerRowIndex !== -1) break;
      }

      if (headerRowIndex === -1) return;

      // 📌 READ DATA ROWS
      for (let i = headerRowIndex + 1; i < rows.length; i++) {
        const row = rows[i];

        const reg = row[colIndex["REGISTER NO"]];
        const name = row[colIndex["STUDENT NAME"]];
        const seat = row[colIndex["DESK NO"]];

        if (!reg || !name || !seat) continue;

        finalData.push({
          "REGISTER NUMBER": String(reg).trim().toUpperCase(),
          "NAME": String(name).trim(),
          "SEAT": String(seat).trim(),
          "HALL": hall || sheetName
        });
      }
    });

    if (!finalData.length) {
      alert("❌ No valid seating data found");
      return;
    }

    const res = await fetch(
      "https://seat-finder-api.harjeetgowda644.workers.dev/admin/upload",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session, data: finalData })
      }
    );

    if (!res.ok) throw new Error("Upload failed");

    alert(`✅ ${session} uploaded successfully (${finalData.length} records)`);
    fileInput.value = "";

  } catch (err) {
    console.error(err);
    alert("Upload failed – check console");
  }
}
</script>

</body>
</html>
