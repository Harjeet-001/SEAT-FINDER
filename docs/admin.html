<!DOCTYPE html>
<html>
<head>
  <title>Admin – Upload Seating Data</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body>

<h2>Admin Panel – Upload Seating Excel</h2>

<h3>FN Session</h3>
<input type="file" id="FN_file" accept=".xlsx,.xls">
<button onclick="uploadExcel('FN')">Upload FN</button>

<h3>AN Session</h3>
<input type="file" id="AN_file" accept=".xlsx,.xls">
<button onclick="uploadExcel('AN')">Upload AN</button>

<script>
async function uploadExcel(session) {
  try {
    const fileInput = document.getElementById(session + "_file");
    const file = fileInput.files[0];
    if (!file) return alert("Select an Excel file");

    const buffer = await file.arrayBuffer();
    const workbook = XLSX.read(buffer, { type: "array" });

    let finalData = [];

    workbook.SheetNames.forEach(sheetName => {
      const sheet = workbook.Sheets[sheetName];

      // ---------- READ RAW ----------
      const rows = XLSX.utils.sheet_to_json(sheet, {
        header: 1,
        defval: ""
      });

      let headerRowIndex = -1;
      let colMap = {};
      let hall = "";

      // ---------- FIND HALL ----------
      rows.slice(0, 10).forEach(r => {
        r.forEach(c => {
          if (typeof c === "string" && c.toUpperCase().startsWith("HALL NO")) {
            hall = c.split(":").slice(1).join(":").trim();
          }
        });
      });

      // ---------- FIND HEADER ROW ----------
      rows.forEach((row, i) => {
        const joined = row.join(" ").toUpperCase();
        if (
          joined.includes("REGISTER") &&
          joined.includes("STUDENT") &&
          joined.includes("DESK")
        ) {
          headerRowIndex = i;
          row.forEach((cell, idx) => {
            const key = String(cell).toUpperCase().trim();
            if (key.includes("REGISTER")) colMap.reg = idx;
            if (key.includes("STUDENT")) colMap.name = idx;
            if (key.includes("DESK")) colMap.seat = idx;
          });
        }
      });

      if (headerRowIndex === -1) return;

      // ---------- READ STUDENT ROWS ----------
      for (let i = headerRowIndex + 1; i < rows.length; i++) {
        const row = rows[i];

        const reg  = row[colMap.reg];
        const name = row[colMap.name];
        const seat = row[colMap.seat];

        if (
          typeof reg !== "string" ||
          reg.trim().length < 5 ||
          !name ||
          !seat
        ) continue;

        finalData.push({
          "REGISTER NUMBER": reg.trim().toUpperCase(),
          "NAME": String(name).trim(),
          "SEAT": String(seat).trim(),
          "HALL": hall
        });
      }
    });

    if (!finalData.length) {
      alert("No valid seating data found");
      return;
    }

    const res = await fetch(
      "https://seat-finder-api.harjeetgowda644.workers.dev/admin/upload",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session, data: finalData })
      }
    );

    if (!res.ok) throw new Error("Upload failed");

    alert(`${session} uploaded successfully (${finalData.length} records)`);
    fileInput.value = "";

  } catch (err) {
    console.error(err);
    alert("Upload failed – check console");
  }
}
</script>



</body>
</html>
