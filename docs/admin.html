<!DOCTYPE html>
<html>
<head>
  <title>Admin – Upload Seating Data</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body>

<h2>Admin Panel – Upload Seating Excel</h2>

<h3>FN Session</h3>
<input type="file" id="FN_file" accept=".xlsx,.xls">
<button onclick="uploadExcel('FN')">Upload FN</button>

<h3>AN Session</h3>
<input type="file" id="AN_file" accept=".xlsx,.xls">
<button onclick="uploadExcel('AN')">Upload AN</button>

<script>
async function uploadExcel(session) {
  try {
    const fileInput = document.getElementById(session + "_file");
    const file = fileInput.files[0];
    if (!file) return alert("Select an Excel file");

    const buffer = await file.arrayBuffer();
    const workbook = XLSX.read(buffer, { type: "array" });

    /* ===============================
       1️⃣ EXTRACT HALL + SIDE (Sheet 1)
       =============================== */
    let hall = "";
    let side = "";

    const metaSheet = workbook.Sheets[workbook.SheetNames[0]];
    const metaRows = XLSX.utils.sheet_to_json(metaSheet, {
      header: 1,
      defval: ""
    });

    for (let r = 0; r < 10; r++) {
      for (let c = 0; c < metaRows[r].length; c++) {
        const cell = String(metaRows[r][c]).toUpperCase();

        if (cell.includes("HALL") && cell.includes("FLOOR")) {
          hall = metaRows[r][c].split(":").slice(1).join(":").trim();
        }

        if (cell.includes("LEFT")) side = "LEFT";
        if (cell.includes("RIGHT")) side = "RIGHT";
      }
    }

    if (!hall) {
      alert("❌ Hall not detected. Check first sheet.");
      return;
    }

    /* ===============================
       2️⃣ EXTRACT STUDENT DATA (ALL SHEETS)
       COLUMN INDEX (VERIFIED):
       0 → SL NO
       1 → REGISTER NO
       2 → STUDENT NAME
       3 → DESK NO
       =============================== */
    let finalData = [];

    workbook.SheetNames.forEach(sheetName => {
      const sheet = workbook.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(sheet, {
        header: 1,
        defval: ""
      });

      rows.forEach(row => {
        const reg  = row[1];
        const name = row[2];
        const seat = row[3];

        if (
          typeof reg === "string" &&
          reg.trim().length > 5 &&
          typeof name === "string" &&
          seat !== ""
        ) {
          finalData.push({
            "REGISTER NUMBER": reg.trim().toUpperCase(),
            "NAME": name.trim(),
            "SEAT": String(seat).trim(),
            "HALL": hall,
            "SIDE": side
          });
        }
      });
    });

    if (!finalData.length) {
      alert("❌ No valid seating data found");
      return;
    }

    /* ===============================
       3️⃣ UPLOAD
       =============================== */
    const res = await fetch(
      "https://seat-finder-api.harjeetgowda644.workers.dev/admin/upload",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session, data: finalData })
      }
    );

    if (!res.ok) throw new Error("Upload failed");

    alert(`✅ ${session} uploaded (${finalData.length} students)`);
    fileInput.value = "";

  } catch (err) {
    console.error(err);
    alert("Upload failed – check console");
  }
}
</script>

</body>
</html>
