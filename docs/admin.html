<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin – Upload Seating Data</title>

  <!-- XLSX LIBRARY (DO NOT TOUCH) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(180deg, #eaf7ff, #f5fbff);
  color: #0f172a;
}


    .glass {
  background: rgba(255, 255, 255, 0.55);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, 0.6);
}


    .admin-container {
  width: 420px;
  padding: 28px;
  border-radius: 18px;
  box-shadow: 0 30px 60px rgba(0,0,0,0.18);
}


    h2 {
  text-align: center;
  margin-bottom: 25px;
  letter-spacing: 1px;
  font-weight: 700;
  color: #0f172a;
}


    .session-box {
  background: rgba(255, 255, 255, 0.8);
  border: 1px solid rgba(15, 23, 42, 0.12);
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 18px;
}


    .session-box h3 {
  margin-top: 0;
  margin-bottom: 12px;
  font-size: 15px;
  font-weight: 600;
  color: #1e40af;
}

    /* Tab toggle */
    .tab-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .tab-btn {
      flex: 1;
      padding: 7px 0;
      border: 1.5px solid #cbd5f5;
      border-radius: 8px;
      background: #f0f4ff;
      color: #475569;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      width: auto;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      border-color: transparent;
    }

    .tab-btn:hover:not(.active) {
      background: #dbeafe;
      border-color: #93c5fd;
    }

    /* Upload panels */
    .upload-panel { display: none; }
    .upload-panel.active { display: block; }

   input[type="file"] {
  width: 100%;
  margin-bottom: 12px;
  padding: 8px;
  background: #ffffff;
  color: #0f172a;
  border: 1px solid #cbd5f5;
  border-radius: 8px;
}


    button.upload-btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button.upload-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(37,99,235,0.35);
    }

    button.upload-btn:active {
      transform: translateY(0);
      box-shadow: none;
    }

    /* Status log for PDF */
    .status-log {
      margin-top: 10px;
      font-size: 11.5px;
      color: #334155;
      background: #f1f5f9;
      border-radius: 8px;
      padding: 8px 10px;
      max-height: 88px;
      overflow-y: auto;
      display: none;
      line-height: 1.7;
    }
    .status-log.show { display: block; }

    .footer-note {
  margin-top: 14px;
  text-align: center;
  font-size: 11px;
  color: #475569;
  opacity: 0.85;
}

  </style>
</head>

<body>

<div class="admin-container glass">
  <h2>ADMIN – SEATING UPLOAD</h2>

  <!-- FN SESSION -->
  <div class="session-box">
    <h3>FN Session</h3>

    <div class="tab-row">
      <button class="tab-btn active" onclick="switchTab('FN','xlsx',this)">📊 Excel</button>
      <button class="tab-btn"        onclick="switchTab('FN','pdf',this)">📄 PDF</button>
    </div>

    <div id="FN_xlsx_panel" class="upload-panel active">
      <input type="file" id="FN_file" accept=".xlsx,.xls">
      <button class="upload-btn" onclick="uploadExcel('FN')">Upload FN</button>
    </div>

    <div id="FN_pdf_panel" class="upload-panel">
      <input type="file" id="FN_pdf_file" accept=".pdf">
      <button class="upload-btn" onclick="uploadPDF('FN')">Upload FN PDF</button>
    </div>

    <div id="FN_log" class="status-log"></div>
  </div>

  <!-- AN SESSION -->
  <div class="session-box">
    <h3>AN Session</h3>

    <div class="tab-row">
      <button class="tab-btn active" onclick="switchTab('AN','xlsx',this)">📊 Excel</button>
      <button class="tab-btn"        onclick="switchTab('AN','pdf',this)">📄 PDF</button>
    </div>

    <div id="AN_xlsx_panel" class="upload-panel active">
      <input type="file" id="AN_file" accept=".xlsx,.xls">
      <button class="upload-btn" onclick="uploadExcel('AN')">Upload AN</button>
    </div>

    <div id="AN_pdf_panel" class="upload-panel">
      <input type="file" id="AN_pdf_file" accept=".pdf">
      <button class="upload-btn" onclick="uploadPDF('AN')">Upload AN PDF</button>
    </div>

    <div id="AN_log" class="status-log"></div>
  </div>

  <div class="footer-note">
    Admin panel • Excel (.xlsx / .xls) or PDF
  </div>
</div>

<script>
// ── PDF.js worker ──────────────────────────────────────────────────────────
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

// ── Tab switcher ───────────────────────────────────────────────────────────
function switchTab(session, type, btn) {
  btn.parentElement.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById(`${session}_xlsx_panel`).classList.toggle("active", type === "xlsx");
  document.getElementById(`${session}_pdf_panel`).classList.toggle("active",  type === "pdf");
  clearLog(session);
}

// ── Log helpers ────────────────────────────────────────────────────────────
function clearLog(session) {
  const el = document.getElementById(`${session}_log`);
  el.innerHTML = "";
  el.classList.remove("show");
}
function log(session, msg) {
  const el = document.getElementById(`${session}_log`);
  el.classList.add("show");
  el.innerHTML += msg + "<br>";
  el.scrollTop = el.scrollHeight;
}

// ═══════════════════════════════════════════════════════════════════════════
// EXCEL UPLOAD  ── original code, completely unchanged
// ═══════════════════════════════════════════════════════════════════════════
async function uploadExcel(session) {
  try {
    const fileInput = document.getElementById(session + "_file");
    const file = fileInput.files[0];
    if (!file) {
      alert("NO FILE SELECTED");
      return;
    }

    const buffer = await file.arrayBuffer();
    const workbook = XLSX.read(buffer, { type: "array" });
    let finalData = [];

    workbook.SheetNames.forEach(sheetName => {
      const sheet = workbook.Sheets[sheetName];
      const matrix = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });

      // ----- HALL DETECTION (UNCHANGED) -----
      let detectedHall = "";
      const merges = sheet["!merges"] || [];
      let hallLabelCell = null;

      for (const addr in sheet) {
        if (addr[0] === "!") continue;
        const cell = sheet[addr];
        if (cell.v && String(cell.v).trim().toUpperCase() === "HALL NO:") {
          hallLabelCell = XLSX.utils.decode_cell(addr);
          break;
        }
      }

      if (hallLabelCell) {
        for (const m of merges) {
          if (
            m.s.r === hallLabelCell.r &&
            hallLabelCell.c >= m.s.c &&
            hallLabelCell.c <= m.e.c
          ) {
            const nextMerge = merges.find(n =>
              n.s.r === m.s.r && n.s.c > m.e.c
            );
            if (nextMerge) {
              const hallAddr = XLSX.utils.encode_cell({
                r: nextMerge.s.r,
                c: nextMerge.s.c
              });
              detectedHall = String(sheet[hallAddr]?.v || "").trim();
            }
            break;
          }
        }
      }

      // ----- HEADER DETECTION -----
      let headerRow = -1;
      for (let i = 0; i < matrix.length; i++) {
        if (
          matrix[i].includes("REGISTER NO") &&
          matrix[i].includes("STUDENT NAME") &&
          matrix[i].includes("DESK NO")
        ) {
          headerRow = i;
          break;
        }
      }

      // ----- SIDE DETECTION (MERGE-BASED, ACTUALLY CORRECT) -----
      let detectedSide = "";
      const mergesAboveHeader = (sheet["!merges"] || []).filter(m => m.e.r < headerRow);

      for (const m of mergesAboveHeader) {
        const addr = XLSX.utils.encode_cell({ r: m.s.r, c: m.s.c });
        const cell = sheet[addr];
        if (!cell || !cell.v) continue;
        const raw = String(cell.v).toUpperCase().replace(/\s+/g, " ").trim();
        if (raw.includes("LEFT"))  { detectedSide = "LEFT";  break; }
        if (raw.includes("RIGHT")) { detectedSide = "RIGHT"; break; }
      }

      if (!detectedSide) {
        console.warn(`❌ SIDE NOT FOUND (MERGE READ FAILED) | sheet=${sheetName}`);
      }

      if (headerRow === -1) return;

      const headers = matrix[headerRow];
      const r = headers.indexOf("REGISTER NO");
      const n = headers.indexOf("STUDENT NAME");
      const s = headers.indexOf("DESK NO");

      for (let i = headerRow + 1; i < matrix.length; i++) {
        const row = matrix[i];
        if (!row[r] || !row[n] || !row[s]) continue;

        finalData.push({
          "REGISTER NUMBER": String(row[r]).trim().toUpperCase(),
          "NAME": String(row[n]).trim(),
          "SEAT": String(row[s]).trim(),
          "HALL": detectedHall,
          "SIDE": detectedSide
        });
      }
    });

    if (finalData.length === 0) {
      alert("❌ NO VALID SEATING DATA FOUND");
      return;
    }

    const res = await fetch(
      "https://seat-finder-api.harjeetgowda644.workers.dev/admin/upload",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session, data: finalData })
      }
    );

    if (!res.ok) throw new Error("UPLOAD FAILED");

    alert(`✅ ${session} UPLOADED (${finalData.length} RECORDS)`);

  } catch (err) {
    console.error(err);
    alert("❌ ERROR – CHECK CONSOLE");
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// PDF UPLOAD  ── dynamic column detection, no hardcoded X values
// ═══════════════════════════════════════════════════════════════════════════
async function uploadPDF(session) {
  clearLog(session);
  try {
    const fileInput = document.getElementById(`${session}_pdf_file`);
    const file = fileInput.files[0];
    if (!file) { alert("NO FILE SELECTED"); return; }

    log(session, "📄 Reading PDF…");
    const buffer  = await file.arrayBuffer();
    const pdfDoc  = await pdfjsLib.getDocument({ data: buffer }).promise;
    const totalPages = pdfDoc.numPages;
    log(session, `📑 ${totalPages} pages found. Parsing…`);

    const finalData = [];
    const SKIP_WORDS = new Set([
      "LEFT","RIGHT","SIDE","NAME","&","SIGNATURE","OF","THE","INVIGILATOR",
      "CLASS","DESK","NO","REGISTER","STUDENT","REMARKS","NO:"
    ]);

    for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
      const page    = await pdfDoc.getPage(pageNum);
      const content = await page.getTextContent();

      // ── Collect all text items ──────────────────────────────────────────
      // PDF.js transform: [scaleX, skewX, skewY, scaleY, translateX, translateY]
      // translateX = x from left, translateY = y from bottom (bottom-up)
      const items = content.items
        .map(i => ({
          text: i.str.trim(),
          x:    i.transform[4],   // distance from left edge
          y:    i.transform[5]    // distance from bottom (higher = higher on page)
        }))
        .filter(i => i.text.length > 0);

      if (items.length === 0) continue;

      // ── Hall: token(s) right after "NO:" skipping non-hall words ────────
      let detectedHall = "";
      for (let i = 0; i < items.length; i++) {
        if (items[i].text === "NO:") {
          for (let j = i + 1; j < Math.min(i + 6, items.length); j++) {
            const t = items[j].text.toUpperCase();
            if (SKIP_WORDS.has(t)) break;
            detectedHall += items[j].text + " ";
          }
          detectedHall = detectedHall.trim();
          break;
        }
      }

      // ── Side: first occurrence of LEFT or RIGHT adjacent to SIDE ────────
      let detectedSide = "";
      for (let i = 0; i < items.length - 1; i++) {
        const t = items[i].text.toUpperCase();
        if ((t === "LEFT" || t === "RIGHT") &&
            items[i + 1].text.toUpperCase() === "SIDE") {
          detectedSide = t;
          break;
        }
      }

      // ── Find the header row by locating "REGISTER" and "DESK" labels ────
      // We look for a line that contains both — that Y is our header Y.
      // In PDF.js coords (bottom-up), the header is somewhere in the middle
      // of the page. Data rows have a LOWER y value than the header.

      let headerY   = null;
      let deskX     = null;
      let regX      = null;
      let nameX     = null;

      // Group all items by Y bucket (3pt) to find lines
      const lineMap = {};
      for (const item of items) {
        const key = Math.round(item.y / 3) * 3;
        lineMap[key] = lineMap[key] || [];
        lineMap[key].push(item);
      }

      // Scan every line for the one containing DESK + REGISTER + STUDENT
      for (const yKey of Object.keys(lineMap).map(Number)) {
        const lineTexts = lineMap[yKey].map(i => i.text.toUpperCase());
        const hasDESK   = lineTexts.some(t => t.includes("DESK"));
        const hasREG    = lineTexts.some(t => t.includes("REGISTER"));
        const hasNAME   = lineTexts.some(t => t.includes("STUDENT") || t.includes("NAME"));

        // Also check the line just above (DESK NO is sometimes split across 2 lines)
        // so we accept a line with at least REGISTER + one of the others
        if (hasREG && (hasDESK || hasNAME)) {
          // Found the header line — read column X positions from it
          for (const item of lineMap[yKey]) {
            const t = item.text.toUpperCase();
            if (t.includes("DESK"))                       deskX = item.x;
            if (t.includes("REGISTER"))                   regX  = item.x;
            if (t.includes("STUDENT") || t === "NAME")    nameX = item.x;
          }

          // DESK NO is sometimes on the line just above (split header).
          // Also check Y+3 bucket for DESK if not found yet.
          if (deskX === null) {
            const aboveLine = lineMap[Math.round((yKey + 3) / 3) * 3] || [];
            for (const item of aboveLine) {
              if (item.text.toUpperCase().includes("DESK")) { deskX = item.x; break; }
            }
          }

          headerY = yKey;
          break;
        }
      }

      if (headerY === null || regX === null) {
        // Blank page or no table
        continue;
      }

      // If we still don't have deskX or nameX, estimate from regX
      // (desk is always to the left of register, name to the right)
      if (deskX === null) deskX = regX - 30;
      if (nameX === null) nameX = regX + 80;

      // Column boundaries: midpoints between detected X positions
      // desk col  : x in [ deskX - 20 ... midpoint(deskX, regX) ]
      // reg  col  : x in [ midpoint(deskX, regX) ... midpoint(regX, nameX) ]
      // name col  : x in [ midpoint(regX, nameX) ... page width ]
      const deskRegMid = (deskX + regX) / 2;
      const regNameMid = (regX  + nameX) / 2;

      // ── Parse data rows: all lines with y < headerY ──────────────────────
      let rowsParsed = 0;

      // Sort Y keys descending (top of page first in bottom-up coords = highest Y first)
      const sortedYKeys = Object.keys(lineMap)
        .map(Number)
        .filter(y => y < headerY)
        .sort((a, b) => b - a);

      for (const yKey of sortedYKeys) {
        const rowItems = lineMap[yKey].sort((a, b) => a.x - b.x);

        let desk = "", reg = "", name = "";
        for (const item of rowItems) {
          if      (item.x < deskRegMid)  desk += item.text + " ";
          else if (item.x < regNameMid)  reg  += item.text + " ";
          else                           name += item.text + " ";
        }

        desk = desk.trim();
        reg  = reg.trim();
        name = name.trim();

        // Validate row:
        // desk  → 1 or 2 digit number only
        // reg   → at least 6 chars, alphanumeric (register numbers like 232AA2241, 2428M0049)
        // name  → non-empty, not a known footer phrase
        if (!desk || !/^\d{1,2}$/.test(desk))                      continue;
        if (!reg  || reg.length < 6)                                continue;
        if (!/^[A-Z0-9]+$/i.test(reg.replace(/\s/g, "")))          continue;
        if (!name)                                                   continue;

        // Skip lines that are clearly footer/header text
        const nameUpper = name.toUpperCase();
        if (nameUpper.includes("KUMARAGURU") ||
            nameUpper.includes("INVIGILATOR") ||
            nameUpper.includes("SEATING") ||
            nameUpper.includes("EXAMINATION")) continue;

        finalData.push({
          "REGISTER NUMBER": reg.replace(/\s/g, "").toUpperCase(),
          "NAME": name,
          "SEAT": desk,
          "HALL": detectedHall,
          "SIDE": detectedSide
        });
        rowsParsed++;
      }

      if (rowsParsed > 0) {
        log(session, `✔ Page ${pageNum}: ${detectedHall} ${detectedSide} → ${rowsParsed} rows`);
      }
    }

    if (finalData.length === 0) {
      log(session, "❌ No valid data found. Is this the correct seating plan PDF?");
      return;
    }

    log(session, `📦 ${finalData.length} records total. Uploading…`);

    const res = await fetch(
      "https://seat-finder-api.harjeetgowda644.workers.dev/admin/upload",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session, data: finalData })
      }
    );

    if (!res.ok) throw new Error("UPLOAD FAILED");

    log(session, `✅ ${session} UPLOADED (${finalData.length} RECORDS)`);

  } catch (err) {
    console.error(err);
    log(session, "❌ ERROR: " + err.message);
  }
}
</script>

</body>
</html>
