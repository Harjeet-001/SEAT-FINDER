<!DOCTYPE html>
<html>
<head>
  <title>Admin – Upload Seating Data</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body>

<h2>Admin Panel – Upload Seating Excel</h2>

<h3>FN Session</h3>
<input type="file" id="FN_file" accept=".xlsx,.xls">
<button onclick="uploadExcel('FN')">Upload FN</button>

<h3>AN Session</h3>
<input type="file" id="AN_file" accept=".xlsx,.xls">
<button onclick="uploadExcel('AN')">Upload AN</button>

<script>
async function uploadExcel(session) {
  try {
    const fileInput = document.getElementById(session + "_file");
    const file = fileInput.files[0];

    if (!file) {
      alert("Select an Excel file first");
      return;
    }

    const buffer = await file.arrayBuffer();
    const workbook = XLSX.read(buffer);

    let finalData = [];

    // 🔴 LOOP THROUGH ALL SHEETS
    workbook.SheetNames.forEach(sheetName => {
      const sheet = workbook.Sheets[sheetName];

      // Read raw rows (important)
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

      if (!rows || rows.length < 5) return;

      // ---------- FIND HALL ----------
      let hall = "UNKNOWN";
      for (let i = 0; i < 8; i++) {
        for (let j = 0; j < (rows[i] || []).length; j++) {
          const cell = rows[i][j];
          if (
            typeof cell === "string" &&
            cell.toUpperCase().includes("HALL")
          ) {
            hall = cell.trim();
          }
        }
      }

      // ---------- FIND HEADER ROW ----------
      const headerIndex = rows.findIndex(r =>
        r.join(" ").toUpperCase().includes("REGISTER")
      );

      if (headerIndex === -1) return;

      // ---------- PARSE STUDENT DATA ----------
      for (let i = headerIndex + 1; i < rows.length; i++) {
        const row = rows[i];
        if (!row || row.length < 3) continue;

        const seat = row[0];
        const reg = row[1];
        const name = row[2];

        if (!reg || !name) continue;

        finalData.push({
          "REGISTER NUMBER": String(reg).trim(),
          "NAME": String(name).trim(),
          "HALL": hall,
          "SEAT": seat ? String(seat).trim() : ""
        });
      }
    });

    if (!finalData.length) {
      alert("No valid seating data found");
      return;
    }

    // ---------- SEND TO API ----------
    const res = await fetch(
      "https://seat-finder-api.harjeetgowda644.workers.dev/admin/upload",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          session: session,
          data: finalData
        })
      }
    );

    const out = await res.json();

    if (out.status === "ok") {
      alert(session + " upload successful");
      fileInput.value = "";
    } else {
      alert("Upload failed");
    }

  } catch (err) {
    console.error(err);
    alert("Upload failed – check console");
  }
}
</script>


</body>
</html>
