<!DOCTYPE html>
<html>
<head>
  <title>Admin – Upload Seating Data</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body>

<h2>ADMIN – SEATING UPLOAD (CONFIRM MODE)</h2>

<h3>FN Session</h3>
<input type="file" id="FN_file" accept=".xlsx,.xls">
<button onclick="uploadExcel('FN')">Upload FN</button>

<h3>AN Session</h3>
<input type="file" id="AN_file" accept=".xlsx,.xls">
<button onclick="uploadExcel('AN')">Upload AN</button>

<script>
async function uploadExcel(session) {
  //alert("SCRIPT RUNNING");

  try {
    const fileInput = document.getElementById(session + "_file");
    const file = fileInput.files[0];
    if (!file) {
      alert("NO FILE SELECTED");
      return;
    }

    const buffer = await file.arrayBuffer();
    const workbook = XLSX.read(buffer, { type: "array" });

    console.log("Sheets:", workbook.SheetNames);

    let finalData = [];

    workbook.SheetNames.forEach(sheetName => {
      const sheet = workbook.Sheets[sheetName];

      // RAW MATRIX READ (IMPORTANT)
      const matrix = XLSX.utils.sheet_to_json(sheet, {
        header: 1,
        defval: ""
      });

      console.log(`Matrix sample (${sheetName}):`, matrix.slice(0, 10));

    // 🧠 ROBUST HALL DETECTION (MERGED-CELL SAFE)
/* ✅ FINAL HALL DETECTION — RAW CELL SCAN (BULLETPROOF) */
/* ✅ HALL DETECTION — MERGE-AWARE (FINAL, CORRECT) */
let detectedHall = "";

const merges = sheet["!merges"] || [];

// Step 1: find cell containing "HALL NO:"
let hallLabelCell = null;

for (const addr in sheet) {
  if (addr[0] === "!") continue;
  const cell = sheet[addr];
  if (
    cell.v &&
    String(cell.v).trim().toUpperCase() === "HALL NO:"
  ) {
    hallLabelCell = XLSX.utils.decode_cell(addr);
    break;
  }
}

// Step 2: find merge containing "HALL NO:"
if (hallLabelCell) {
  for (let i = 0; i < merges.length; i++) {
    const m = merges[i];

    const isSameRow =
      m.s.r === hallLabelCell.r &&
      m.e.r === hallLabelCell.r;

    if (
      isSameRow &&
      hallLabelCell.c >= m.s.c &&
      hallLabelCell.c <= m.e.c
    ) {
      // Step 3: next merge on same row = HALL VALUE
      const nextMerge = merges.find(n =>
        n.s.r === m.s.r && n.s.c > m.e.c
      );

      if (nextMerge) {
        const hallCellAddr = XLSX.utils.encode_cell({
          r: nextMerge.s.r,
          c: nextMerge.s.c
        });
        detectedHall = String(sheet[hallCellAddr]?.v || "").trim();
      }
      break;
    }
  }
}

console.log("✅ FINAL HALL:", detectedHall);




      // 🔎 FIND HEADER ROW
      let headerRowIndex = -1;
      for (let i = 0; i < matrix.length; i++) {
        if (
          matrix[i].includes("REGISTER NO") &&
          matrix[i].includes("STUDENT NAME") &&
          matrix[i].includes("DESK NO")
        ) {
          headerRowIndex = i;
          break;
        }
      }

      if (headerRowIndex === -1) {
        console.warn(`Header not found in ${sheetName}`);
        return;
      }

      const headers = matrix[headerRowIndex];
      const regIdx = headers.indexOf("REGISTER NO");
      const nameIdx = headers.indexOf("STUDENT NAME");
      const seatIdx = headers.indexOf("DESK NO");

      for (let i = headerRowIndex + 1; i < matrix.length; i++) {
        const row = matrix[i];

        const reg = row[regIdx];
        const name = row[nameIdx];
        const seat = row[seatIdx];

        if (!reg || !name || !seat) continue;

        finalData.push({
          "REGISTER NUMBER": String(reg).trim().toUpperCase(),
          "NAME": String(name).trim(),
          "SEAT": String(seat).trim(),
          "HALL": detectedHall
        });
      }
    });

    console.log("FINAL COUNT:", finalData.length);

    if (finalData.length === 0) {
      alert("❌ NO VALID SEATING DATA FOUND");
      return;
    }

    //alert(`UPLOADING ${finalData.length} RECORDS`);

    const res = await fetch(
      "https://seat-finder-api.harjeetgowda644.workers.dev/admin/upload",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session, data: finalData })
      }
    );

    if (!res.ok) throw new Error("UPLOAD FAILED");

    alert(`✅ ${session} UPLOADED (${finalData.length} RECORDS)`);

  } catch (err) {
    console.error(err);
    alert("❌ ERROR – CHECK CONSOLE");
  }
}
</script>

</body>
</html>
