<!DOCTYPE html>
<html>
<head>
  <title>Admin – Upload Seating Data</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body>

<h2>Admin Panel – Upload Seating Excel</h2>

<h3>FN Session</h3>
<input type="file" id="FN_file" accept=".xlsx,.xls">
<button onclick="uploadExcel('FN')">Upload FN</button>

<h3>AN Session</h3>
<input type="file" id="AN_file" accept=".xlsx,.xls">
<button onclick="uploadExcel('AN')">Upload AN</button>

<script>
async function uploadExcel(session) {
  try {
    const fileInput = document.getElementById(session + "_file");
    const file = fileInput.files[0];
    if (!file) return alert("Select an Excel file");

    const buffer = await file.arrayBuffer();
    const workbook = XLSX.read(buffer, { type: "array" });

    let finalData = [];

    workbook.SheetNames.forEach(sheetName => {
      const sheet = workbook.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(sheet, {
        header: 1,
        defval: ""
      });

      const hall = extractHall(rows) || sheetName;

      rows.forEach(row => {
        if (!Array.isArray(row) || row.length < 4) return;

        // 🔥 FLEXIBLE COLUMN DETECTION
        const reg = row.find(c => typeof c === "string" && /[A-Z0-9]{6,}/i.test(c));
        const name = row.find(c => typeof c === "string" && /^[A-Za-z ]{3,}$/.test(c));
        const seat = row.find(c => typeof c === "number" || /^[A-Z]?\d+$/.test(c));

        if (!reg || !name || !seat) return;

        finalData.push({
          "REGISTER NUMBER": reg.trim().toUpperCase(),
          "NAME": name.trim(),
          "SEAT": String(seat).trim(),
          "HALL": hall
        });
      });
    });

    if (!finalData.length) {
      alert("No valid seating data found");
      return;
    }

    const res = await fetch(
      "https://seat-finder-api.harjeetgowda644.workers.dev/admin/upload",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session, data: finalData })
      }
    );

    if (!res.ok) throw new Error("Upload failed");

    alert(`${session} uploaded successfully (${finalData.length} records)`);
    fileInput.value = "";

  } catch (err) {
    console.error(err);
    alert("Upload failed – check console");
  }
}

function extractHall(rows) {
  for (let i = 0; i < Math.min(rows.length, 5); i++) {
    if (!Array.isArray(rows[i])) continue;
    for (const cell of rows[i]) {
      const text = String(cell || "");
      if (text.toLowerCase().includes("hall")) {
        return text.trim();
      }
    }
  }
  return null;
}
</script>






</body>
</html>
