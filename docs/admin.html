<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin – Upload Seating Data</title>

  <!-- XLSX LIB -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      padding: 40px;
    }

    h2 {
      color: #38bdf8;
    }

    .box {
      background: #020617;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 8px;
      border: 1px solid #1e293b;
    }

    button {
      background: #38bdf8;
      color: #020617;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #0ea5e9;
    }
  </style>
</head>

<body>

<h2>ADMIN PANEL – DEBUG MODE</h2>

<div class="box">
  <h3>FN Session</h3>
  <input type="file" id="FN_file" accept=".xlsx,.xls">
  <br><br>
  <button id="uploadFN">Upload FN</button>
</div>

<div class="box">
  <h3>AN Session</h3>
  <input type="file" id="AN_file" accept=".xlsx,.xls">
  <br><br>
  <button id="uploadAN">Upload AN</button>
</div>

<script>
/* ---------------- HARD PROOFS ---------------- */
alert("✅ JavaScript is RUNNING");

if (typeof XLSX === "undefined") {
  alert("❌ XLSX NOT LOADED");
} else {
  console.log("✅ XLSX loaded");
}

/* ---------------- BUTTON BINDING ---------------- */
document.getElementById("uploadFN").addEventListener("click", () => {
  uploadExcel("FN");
});

document.getElementById("uploadAN").addEventListener("click", () => {
  uploadExcel("AN");
});

/* ---------------- MAIN FUNCTION ---------------- */
async function uploadExcel(session) {
  alert("🚀 uploadExcel() called for " + session);

  try {
    const fileInput = document.getElementById(session + "_file");
    const file = fileInput.files[0];

    if (!file) {
      alert("❌ No file selected");
      return;
    }

    console.log("📄 File selected:", file.name);

    const buffer = await file.arrayBuffer();
    const workbook = XLSX.read(buffer, { type: "array" });

    console.log("📘 Sheets found:", workbook.SheetNames);

    let finalData = [];

    workbook.SheetNames.forEach(sheetName => {
      const sheet = workbook.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });

      console.log(`📄 ${sheetName} → rows:`, rows.length);

      if (!rows.length) return;

      // 🔥 Detect hall from first 10 rows (raw scan)
      let detectedHall = "";

      for (let i = 0; i < Math.min(10, rows.length); i++) {
        for (const key in rows[i]) {
          const cell = String(rows[i][key] || "");
          if (cell.toUpperCase().includes("HALL NO")) {
            detectedHall = cell.split(":").slice(1).join(":").trim();
            break;
          }
        }
        if (detectedHall) break;
      }

      console.log(`🏫 Hall detected for ${sheetName}:`, detectedHall);

      rows.forEach(row => {
        const reg = row["REGISTER NO"];
        const name = row["STUDENT NAME"];
        const seat = row["DESK NO"];

        if (!reg || !name || !seat) return;

        finalData.push({
          "REGISTER NUMBER": String(reg).trim().toUpperCase(),
          "NAME": String(name).trim(),
          "SEAT": String(seat).trim(),
          "HALL": detectedHall || sheetName
        });
      });
    });

    console.log("✅ FINAL DATA COUNT:", finalData.length);

    if (!finalData.length) {
      alert("❌ No valid seating data found");
      return;
    }

    const res = await fetch(
      "https://seat-finder-api.harjeetgowda644.workers.dev/admin/upload",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session, data: finalData })
      }
    );

    if (!res.ok) throw new Error("Server error");

    alert(`✅ ${session} uploaded successfully (${finalData.length} records)`);
    fileInput.value = "";

  } catch (err) {
    console.error("🔥 ERROR:", err);
    alert("❌ Upload failed — check console");
  }
}
</script>

</body>
</html>
